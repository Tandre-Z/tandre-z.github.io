name: Aggregate TVBox sources

on:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC（北京时间 08:17）自动运行
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  aggregate-tvbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Aggregate and deduplicate TVBox sources
        run: |
          python scripts/aggregate_tvbox.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add tvbox/
          git diff --staged --quiet || (git commit -m 'Update TVBox aggregate from sources' && git push origin main)
